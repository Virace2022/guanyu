name: 检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:release
      - run: npm run test:sign
      - run: npm run test:settings
      - run: npm run test:backpack
      - run: npm run build
